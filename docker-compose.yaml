version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

  supavisor:
    image: supabase/supavisor:2.7.4
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      POOLER_TENANT_ID: '${POOLER_TENANT_ID}'
      POOLER_DEFAULT_POOL_SIZE: '${POOLER_DEFAULT_POOL_SIZE}'
      POOLER_MAX_CLIENT_CONN: '${POOLER_MAX_CLIENT_CONN}'
    depends_on:
      - db
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

  postgrest:
    image: postgrest/postgrest:latest
    restart: always
    environment:
      PGRST_DB_URI: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_DB_SCHEMA: "public"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - db
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

  gotrue:
    image: supabase/gotrue:v2.183.0-rc.10
    restart: always
    environment:
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
    depends_on:
      - db
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

  realtime:
    image: supabase/realtime:latest
    restart: always
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      PORT: 4000
    depends_on:
      - db
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

  storage:
    image: supabase/storage-api:latest
    restart: always
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      STORAGE_BACKEND: file
      FILE_STORAGE_PATH: /var/lib/storage
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      - db
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

  studio:
    image: supabase/studio:latest
    restart: always
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SITE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    depends_on:
      - postgrest
    networks:
      - supabase-net
      - coolify
    env_file:
      - .env

volumes:
  db-data:
  storage-data:

networks:
  supabase-net:
    external: true
  coolify:
    external: true
